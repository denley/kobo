[workspace]
resolver = "3"
members = ["crates/kobo-core", "crates/kobo-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/denley/kobo"
rust-version = "1.98"

[workspace.dependencies]
kobo-core = { path = "crates/kobo-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
toml = "0.9"

[workspace.lints.clippy]
all = "warn"
